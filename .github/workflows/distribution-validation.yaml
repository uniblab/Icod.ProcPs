name: distribution-validation

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration to validate
        required: true
        default: Release
        type: choice
        options:
          - Debug
          - Staging
          - Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.configuration }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x

jobs:
  validate-distributions:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            architecture: x64
          - os: windows-11-arm
            platform: Windows
            architecture: ARM64
          - os: ubuntu-24.04
            platform: Linux
            architecture: x64
          - os: ubuntu-24.04-arm
            platform: Linux
            architecture: ARM64
          - os: macos-15-intel
            platform: macOS
            architecture: x64
          - os: macos-15
            platform: macOS
            architecture: ARM64
    name: ${{ matrix.platform }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build, pack, install, and exercise distributions
        shell: pwsh
        run: >-
          ./packaging/VerifyDistribution.ps1
          -Configuration '${{ inputs.configuration }}'
