name: pr-build

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  SOLUTION_PATH: Icod.ProcPs.sln
  ROUTER_PROJECT: procps/Icod.ProcPs.Router.csproj
  ARTIFACT_DIRECTORY: artifacts
  CONFIGURATION: Staging

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            verify_package: false
          - os: ubuntu-latest
            name: Linux
            verify_package: true
          - os: macos-latest
            name: macOS
            verify_package: false
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}
      - name: Build
        run: >-
          dotnet build ${{ env.SOLUTION_PATH }}
          -c ${{ env.CONFIGURATION }}
          --no-restore
          -p:ContinuousIntegrationBuild=true
      - name: Test
        run: >-
          dotnet test ${{ env.SOLUTION_PATH }}
          -c ${{ env.CONFIGURATION }}
          --no-build
          --no-restore
      - name: Pack exact PR artifact
        if: matrix.verify_package
        run: >-
          dotnet pack ${{ env.ROUTER_PROJECT }}
          -c ${{ env.CONFIGURATION }}
          --no-build
          --no-restore
          --output ${{ env.ARTIFACT_DIRECTORY }}
          -p:ContinuousIntegrationBuild=true
      - name: Verify exact PR artifact
        if: matrix.verify_package
        shell: pwsh
        run: >-
          ./.github/scripts/verify-release-package.ps1
          -ArtifactDirectory '${{ env.ARTIFACT_DIRECTORY }}'
          -Configuration '${{ env.CONFIGURATION }}'
